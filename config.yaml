    - handle: WatcherGuru
      name: Watcher Guru
    - handle: Bitcoin
      name: Bitcoin
    - handle: glassnode
      name: Glassnode
    - handle: cryptoquant_official
      name: CryptoQuant
    - handle: TreeNewsFeed
      name: Tree News
    - handle: wublockchainenglish
      name: Wu Blockchain
    - handle: CoinBureau
      name: Coin Bureau

