  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  # Zapas gdy BTalk pusty (GitHub Actions): publiczne API Lemmy
  lemmy_instance: https://lemmy.world
  lemmy_communities:
    - bitcoin
    - cryptocurrency

# Publiczne kanały Telegram przez t.me/s/ — BEZ konta / Bot API.
# Tylko wiodące media/on-chain (nie mikro-eksperci, nie airdropy).
