timezone: Europe/Warsaw
send_hour_local: 7
send_minute_local: 30

tradingview_url: "https://www.tradingview.com/chart/?symbol=BITSTAMP%3ABTCUSD"
tradingview_eth_url: "https://www.tradingview.com/chart/?symbol=BITSTAMP%3AETHUSD"

limits:
  crypto_articles: 14
  macro_articles: 6
  forum_threads: 8
  telegram_posts: 14
  x_posts: 12
  per_feed: 6
  # odrzucaj artykuły starsze niż N dni (i bez daty) — koniec „newsy z 2024”
  max_article_age_days: 4

# Tylko świeże, stricte krypto / agregatory z filtrem słów kluczowych.
# Usunięte martwe/off-topic: Kryptowaluty.info.pl, KryptoEkonomia, Money.pl „krypto”, FXMAG, Comparic ogólny.
rss_crypto_pl:
  - name: BitHub
    url: https://bithub.pl/feed/
    lang: pl
  - name: Bitcoin.pl
    url: https://bitcoin.pl/feed/
    lang: pl
  - name: BeInCrypto PL
    url: https://pl.beincrypto.com/feed/
    lang: pl
  # Google News usunięty: w RSS podaje „świeżą” datę indeksacji, nie publikacji
  # (np. artykuł Analizy.pl z 2026-08-25 wracał z datą listopadową).

rss_crypto_en:
  - name: CoinDesk
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
    lang: en
  - name: Cointelegraph
    url: https://cointelegraph.com/rss
    lang: en
  - name: Decrypt
    url: https://decrypt.co/feed
    lang: en
  - name: The Block
    url: https://www.theblock.co/rss.xml
    lang: en
  - name: CryptoSlate
    url: https://cryptoslate.com/feed/
    lang: en
  - name: Bitcoin Magazine
    url: https://bitcoinmagazine.com/feed
    lang: en
  - name: The Defiant
    url: https://thedefiant.io/feed
    lang: en
  - name: CryptoPotato
    url: https://cryptopotato.com/feed/
    lang: en
  - name: Bitcoin.com News
    url: https://news.bitcoin.com/feed/
    lang: en
  - name: Unchained
    url: https://unchainedcrypto.com/feed/
    lang: en
  - name: BeInCrypto EN
    url: https://beincrypto.com/feed/
    lang: en

rss_macro:
  - name: Bankier
    url: https://www.bankier.pl/rss/wiadomosci.xml
    lang: pl
  - name: Federal Reserve Press
    url: https://www.federalreserve.gov/feeds/press_all.xml
    lang: en

forum:
  bitcointalk_board_url: https://bitcointalk.org/index.php?board=1.0
  # Browser UA — BitcoinTalk częściej puszcza; na Actions i tak bywa blokada IP
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  # Zapas gdy BTalk pusty (GitHub Actions): publiczne API Lemmy
  lemmy_instance: https://lemmy.world
  lemmy_communities:
    - bitcoin
    - cryptocurrency

# Publiczne kanały Telegram przez t.me/s/ — BEZ konta / Bot API.
# Tylko wiodące media/on-chain (nie mikro-eksperci, nie airdropy).
telegram:
  enabled: true
  max_age_hours: 72
  per_channel: 2
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  channels:
    - handle: cointelegraph
      name: Cointelegraph
    - handle: WatcherGuru
      name: Watcher Guru
    - handle: Bitcoin
      name: Bitcoin
    - handle: glassnode
      name: Glassnode
    - handle: cryptoquant_official
      name: CryptoQuant
    - handle: TreeNewsFeed
      name: Tree News
    - handle: wublockchainenglish
      name: Wu Blockchain
    - handle: CoinBureau
      name: Coin Bureau

# X (Twitter) — bez oficjalnego API: publiczne RSS FxTwitter (fxtwitter.com).
# Konto X NIE daje darmowego API; oficjalne API jest płatne. FxTwitter bywa kruche (404).
x_twitter:
  enabled: true
  max_age_hours: 72
  per_account: 2
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  accounts:
    - handle: saylor
      name: Michael Saylor
    - handle: DocumentingBTC
      name: Documenting Bitcoin
    - handle: APompliano
      name: Anthony Pompliano
    - handle: CryptoHayes
      name: Arthur Hayes
    - handle: adam3us
      name: Adam Back
    - handle: lopp
      name: Jameson Lopp
    - handle: LynAldenContact
      name: Lyn Alden
    - handle: Excellion
      name: Samson Mow
    - handle: whale_alert
      name: Whale Alert
    - handle: coinbase
      name: Coinbase
